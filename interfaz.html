<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="interfaz.css">
</head>

<body>
    
    <div class="arriba">
        <div class="izquierda">
        <button id="menu">&#9776;</button>
        </div>
        <div class="centro">
        <h3 id="titulo">Interfaz de Proveedor</h3>
        </div>
        <div class="derecha">
        <button id="agregar" onclick="abrirForm()">+</button>
        <button id="cambiointer" onclick="location.href='otro.html'">Interfaz de cliente</button>
        </div>
        
    </div>
    <div id="formulario" class="formulario">
        <h4>Nuevo producto</h4>
        <input type="text" id="nombre" placeholder="Nombre del producto">
        <input type="number" id="precio" placeholder="Precio">
        <textarea id="descripcion" placeholder="Descripción breve"></textarea>
        <label>Imagen del producto</label>
        <input type="file" id="imagen" accept="image/*">
        <input type="url" id="ubicacion" placeholder="Url de la ubicación del producto">
        <button onclick="confirmar()">Confirmar</button>
        <button onclick="cerrarForm()">Cancelar</button>
    </div>
       
    <div id="cuadro-info">
        <h2>Menú</h2>
        <p>No hay menu</p>
    </div>
    <div id="panel-group">
       
    </div>
    
<script type="module" src="script.js"></script>
</body>
</html>
